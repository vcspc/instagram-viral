[project]
name = "instagram-viral"
version = "0.1.0"
description = "Ferramenta de pesquisa e análise de Reels virais com instagrapi e agente Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "instagrapi>=2.1.2",
    "google-genai>=0.1.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pyotp>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
